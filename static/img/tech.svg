<svg width="400" height="300" viewBox="0 0 400 300"
    xmlns="http://www.w3.org/2000/svg">
    <style>
        .leaf {
            fill: #2c7744;
        }
        .leaf-light {
            fill: #4caf50;
        }
        .brain {
            fill: #6a1b9a;
        }
        .brain-light {
            fill: #9c27b0;
        }
        .path {
            stroke: #9c27b0;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 5, 5;
        }
        .circle {
            fill: white;
            stroke: #2c7744;
            stroke-width: 2;
        }
        .text {
            font-family: Arial;
            font-size: 12px;
            fill: #333;
        }
    </style>
    <!-- Background -->
    <rect x="0" y="0" width="400" height="300" fill="#f5f5f5" rx="10" ry="10" />
    <!-- Plant on the left -->
    <g transform="translate(80, 150)">
        <path class="leaf" d="M0,0 Q-30,-50 -10,-80 Q10,-50 0,0" />
        <path class="leaf-light" d="M0,0 Q30,-50 10,-80 Q-10,-50 0,0" />
        <path class="leaf" d="M0,0 Q-40,-30 -50,-50 Q-20,-40 0,0" />
        <path class="leaf-light" d="M0,0 Q40,-30 50,-50 Q20,-40 0,0" />
        <rect x="-5" y="0" width="10" height="80" fill="#795548" />
        <circle class="circle" cx="0" cy="120" r="30" />
        <text class="text" x="-20" y="125">Input</text>
    </g>
    <!-- Brain in the middle -->
    <g transform="translate(200, 150)">
        <circle cx="0" cy="0" r="60" fill="#f0f0f0" stroke="#6a1b9a"
            stroke-width="2" />
        <path class="brain"
            d="M-20,-20 Q-30,-40 -10,-35 Q0,-45 10,-35 Q30,-40 20,-20" />
        <path class="brain-light"
            d="M-30,0 Q-40,20 -20,25 Q0,35 20,25 Q40,20 30,0" />
        <path class="brain" d="M-15,10 Q-20,25 -5,20 Q0,30 5,20 Q20,25 15,10" />
        <text class="text" x="-17" y="5">AI Model</text>
    </g>
    <!-- Results on the right -->
    <g transform="translate(320, 150)">
        <rect x="-40" y="-40" width="80" height="80" fill="#e8f5e9"
            stroke="#2c7744" stroke-width="2" rx="5" ry="5" />
        <line x1="-25" y1="-20" x2="25" y2="-20" stroke="#2c7744"
            stroke-width="2" />
        <line x1="-25" y1="0" x2="25" y2="0" stroke="#2c7744"
            stroke-width="2" />
        <line x1="-25" y1="20" x2="15" y2="20" stroke="#2c7744"
            stroke-width="2" />
        <circle class="circle" cx="0" cy="120" r="30" />
        <text class="text" x="-25" y="125">Results</text>
    </g>
    <!-- Connecting paths -->
    <path class="path" d="M80,270 C140,290 160,290 200,270" />
    <path class="path" d="M200,270 C240,290 260,290 320,270" />
    <!-- Title -->
    <text
        style="font-family: Arial; font-size: 16px; font-weight: bold; fill: #2c7744;"
        x="90" y="40">AI-Powered Plant Disease Detection</text>
</svg>